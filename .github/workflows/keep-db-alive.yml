name: Keep Supabase Active

on:
  schedule:
    - cron: '0 12 * * */6'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -X POST https://${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping_db \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
