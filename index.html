<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Games_Favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Games Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only when a touch phone is held sideways (see .rotate-lock in
         index.css). Browsers on iOS can't truly lock the screen to portrait, so
         this covers the app instead of letting it reflow to the wider screen. -->
    <div class="rotate-lock" role="alert">
      <svg class="rotate-lock__icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="14" y="4" width="20" height="40" rx="4" />
        <path d="M21 8h6" />
      </svg>
      <h1 class="rotate-lock__title">Turn your phone upright</h1>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
